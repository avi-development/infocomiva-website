    .card {
      width: 620px; height: 620px; position: relative; overflow: hidden;
      color: #fff; border-radius: 16px;

    @media (max-width: 660px) {
      .card { transform: scale(calc((100vw - 32px) / 620)); }
      .card-shell { height: calc(100vw - 32px); width: calc(100vw - 32px); }

    /* Decorative dots top-right — purely visual texture. */
    .card::before {
      content: ''; position: absolute;
      top: 70px; right: 60px; width: 60px; height: 60px;

      position: absolute; top: 132px; left: 32px; z-index: 3;
      width: 68px; height: 68px; border-radius: 14px;

      box-shadow: 0 10px 26px rgba(37,99,235,0.45);

      position: absolute; top: 142px; left: 120px; right: 32px; z-index: 3;
      font-size: 11px; font-weight: 800; color: var(--azure-300);
      letter-spacing: 0.18em; text-transform: uppercase;

      position: absolute; top: 168px; left: 120px; right: 32px; z-index: 3;

      font-size: 34px; line-height: 1.05; letter-spacing: -0.025em;

    /* Bullets — three short value props. */
    .bullets {
      position: absolute; top: 350px; left: 32px; right: 32px; z-index: 3;
      font-size: 14px; line-height: 1.4; color: rgba(255,255,255,0.92);

    .bullets .row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .bullets .row .tick {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px;

  // ─── Template ───────────────────────────────────────────────────
  function renderCard(cat, idx) {
    const cardId = 'card-' + idx;
    const filename = String(idx + 1).padStart(2, '0') + '-' + cat.slug;
    const svg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[cat.icon] || ICONS.code}</svg>`;
    const bullets = cat.bullets.map(b => `
        <div class="row"><div class="tick">✓</div><div class="txt">${b}</div></div>`).join('');
    return `
  <div class="card-shell">
    <button class="download-btn" data-card="${cardId}" data-name="infocomiva-${filename}">⬇ Download</button>
    <section class="card" id="${cardId}">
      <div class="brand">
        <img class="eagle" data-eagle crossorigin="anonymous" src="" alt="" style="display:none">
        <span class="eagle-fallback" data-eagle-fb>IT</span>
        <div>
          <div class="name">Infocomiva <span class="ti">Technologies</span></div>
          <div class="tag">where you can rely upon!</div>
        </div>
      </div>
      <div class="usp">
        <span class="dot"></span>
        <span>Sign Up Today · Prototype in <span class="h">24h</span></span>
      </div>

      <div class="icon-wrap">${svg}</div>
      <div class="tagline">${cat.tagline}</div>
      <div class="title">${cat.title}</div>

      <div class="bullets">${bullets}
      </div>

      <div class="cta">Get Your Prototype In 24h <span class="arrow">→</span></div>

      <div class="contact-strip">
        <div class="col">
          <span><span class="ic">📞</span>+91 89188 97474</span>
          <span><span class="ic">📞</span>+91 77185 69194</span>
        </div>
        <div class="col" style="align-items: flex-end;">
          <span class="web">www.infocomiva.live</span>
          <span><span class="ic">✉</span>hello@infocomiva.live</span>
        </div>
      </div>
    </section>
  </div>`;
  }

  // ─── Mount all cards into the grid ──────────────────────────────
  const cardsWrap = document.getElementById('cards');
  cardsWrap.innerHTML = CATEGORIES.map(renderCard).join('');

  // Wire individual download buttons (avoids inline-onclick CSP woes).
  cardsWrap.querySelectorAll('.download-btn').forEach((btn) => {
    btn.addEventListener('click', () => window.dl(btn.dataset.card, btn.dataset.name));
  });

  // ─── Eagle loader (same pattern as social-cards) ────────────────
  // Fetch eagle URL from Firestore, convert to data URL so html2canvas
  // never trips on cross-origin canvas-taint protection.
  const app = initializeApp({
    apiKey: "AIzaSyAmJKD3Saep17Ij4jWN2vgZSypk17VjuZg",
    authDomain: "cargologic-saas.firebaseapp.com",
    projectId: "cargologic-saas",
    storageBucket: "cargologic-saas.firebasestorage.app",
    messagingSenderId: "1005412538844",
    appId: "1:1005412538844:web:26e6ce0ae52c6065c3d719",
  });
  const db = getFirestore(app);

  async function urlToDataUrl(url) {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  async function loadEagle() {
    try {
      const snap = await getDoc(doc(db, "appSettings", "infocomiva"));
      if (!snap.exists()) throw new Error("appSettings/infocomiva missing");
      const url = (snap.data() || {}).eagle;
      if (!url || typeof url !== "string") throw new Error("eagle URL missing");
      const dataUrl = await urlToDataUrl(url);
      document.querySelectorAll('[data-eagle]').forEach((img) => {
        img.src = dataUrl;
        img.style.display = 'block';
      });
      document.querySelectorAll('[data-eagle-fb]').forEach((fb) => fb.remove());
      console.info('[category-banners] eagle loaded and inlined');
    } catch (err) {
      console.warn('[category-banners] eagle loader failed — IT badge stays:', err);
    }
  }

  // ─── Capture + download ─────────────────────────────────────────
  async function captureCard(id) {
    const el = document.getElementById(id);
    if (!el) throw new Error('card not found: ' + id);
    const prev = el.style.transform;
    el.style.transform = 'none';
    try {
      return await html2canvas(el, {
        width: 620, height: 620, scale: 2,    // scale: 2 for sharper PNG
        useCORS: true, allowTaint: false, backgroundColor: null,
        logging: false, imageTimeout: 15000,
      });
    } finally { el.style.transform = prev; }
  }

  function triggerDownload(canvas, filename) {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }

  window.dl = async function (id, filename) {
    try {
      const canvas = await captureCard(id);
      triggerDownload(canvas, filename);
    } catch (err) {
      alert('Capture failed: ' + err.message);
    }
  };

  window.downloadAll = async function () {
    const btn = document.getElementById('dl-all');
    btn.disabled = true;
    const status = document.getElementById('status');
    for (let i = 0; i < CATEGORIES.length; i++) {
      const cat = CATEGORIES[i];
      const name = 'infocomiva-' + String(i + 1).padStart(2, '0') + '-' + cat.slug;
      status.textContent = `Capturing ${i + 1} / ${CATEGORIES.length}: ${cat.title}…`;
      try {
        const canvas = await captureCard('card-' + i);
        triggerDownload(canvas, name);
        await new Promise((r) => setTimeout(r, 400));
      } catch (e) {
        console.warn('skipped', i, e);
      }
    }
    status.textContent = `Done — ${CATEGORIES.length} PNGs queued.`;
    btn.disabled = false;
  };

  // ─── Boot ───────────────────────────────────────────────────────
  const status = document.getElementById('status');
  const dlAll = document.getElementById('dl-all');
  status.textContent = 'Loading eagle logo…';
  await loadEagle();
  status.textContent = `Images ready ✓ ${CATEGORIES.length} banners loaded — click Download to save PNGs.`;
  status.style.color = '#10b981';
  dlAll.disabled = false;
</script>
